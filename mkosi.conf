# theatre-os mkosi config. Single image build produces:
#
#   theatre-os_<v>.raw          — bootable disk image (`dd` install media)
#   theatre-os_<v>.efi          — UKI matching the rootfs (also consumed
#                                 by sysupdate, dropped into the ESP)
#   theatre-os_<v>.tar          — rootfs tarball (consumed by sysupdate
#                                 on already-installed boxes)
#   theatre-os_<v>.SHA256SUMS   — covers all of the above
#
# Format=disk drives systemd-repart (configs in mkosi.repart/), and
# SplitArtifacts=uki,tar splits the UKI and a tar of the rootfs out
# of the disk build so they can be published independently. See
# README → Build & publish.

[Config]
# Build the initrd subimage before this one — its cpio is embedded in
# our UKI via Initrds= below. (Dependencies= is a [Config] setting;
# the image it names is wired in under [Content].)
Dependencies=initrd

[Distribution]
Distribution=arch

[Build]
# Pass the git SHA through from the host (set by build.sh) into the
# build sandbox, where mkosi.finalize appends it to /usr/lib/os-release
# as THEATREOS_GIT_SHA. Lets us trace any running version back to its
# source commit. The bare variable name (no =value) means "pass the
# host's value" per mkosi.conf(5) Environment=.
Environment=THEATREOS_GIT_SHA

Incremental=yes

[Output]
ImageId=theatre-os
Format=disk
SplitArtifacts=uki,tar
# Tar is uncompressed: gigabit LAN, wire time is seconds. Transport
# compression can be added at the HTTP layer later without touching
# this repo. See README → Build & publish.
CompressOutput=no
# ImageVersion is read from the executable ./mkosi.version on each build
# and flows into artefact filenames AND /usr/lib/os-release VERSION_ID
# in both the rootfs and the initrd. One source of truth.
# Output / cache / build directories: mkosi auto-detects mkosi.output/,
# mkosi.cache/, mkosi.builddir/ if they exist in the project root.
# Package downloads are cached automatically (in ~/.cache by default,
# or in mkosi.pkgcache/ if the dir exists).

[Validation]
# Single LAN trust boundary; HTTPS + SHA256 covers transport
# corruption. Revisit if updates ever leave the homelab.
SecureBoot=no
# SHA256SUMS covering all artefacts. See README → Architecture →
# Distribution: HTTPS + SHA256 is our integrity story; no GPG signing.
Checksum=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
# Use our custom initrd subimage (mkosi.images/initrd/) instead of
# the auto-built default. We need .mount units inside the initrd to
# mount @os/<v> at /sysroot, and mkosi's auto-built initrd doesn't
# inherit our mkosi.extra/ — only a sibling subimage with
# `Include=mkosi-initrd` can carry our overlay.
Initrds=%O/initrd

# Generic, version-independent kernel cmdline. The version stamp lives
# in the UKI's embedded /usr/lib/os-release; the initrd reads it from
# there to pick @os/<v> / @persist/<v> at mount time.
# console=ttyS0 is for AMT Serial-over-LAN visibility (see README →
# Accounts & remote access).
#
# rd.systemd.gpt_auto=0 + systemd.gpt_auto=0 disable systemd-gpt-
# auto-generator. Without this, when there's no `root=` on the
# cmdline AND we boot via systemd-boot (which sets the EFI
# LoaderDevicePartUUID variable), the generator engages root
# auto-discovery, registers a fsck dependency on /dev/gpt-auto-root,
# fails to find a discoverable root partition (our data partition
# is GPT type "Linux generic data", not SD_GPT_ROOT), and the leaked
# fsck dependency hangs initrd-root-fs.target forever — even though
# our own sysroot.mount overrides the generated one. There is no
# per-unit "I've got this" mechanism upstream (see systemd#35628).
#
# Side effect of disabling the generator: the ESP isn't auto-mounted
# at /efi by it either. We mount it explicitly via efi.mount in
# mkosi.extra/usr/lib/systemd/system/ — sysupdate's UKI transfer
# (PathRelativeTo=esp) needs it mounted, despite docs implying
# self-discovery. See README → Boot sequence (step 6).
#
# systemd.getty_auto=0 disables systemd's autovt@ttyN on-demand getty
# spawning. We don't use any tty other than tty1 (Kodi); moonlight
# runs as a sibling system unit on the same tty1 via Conflicts= with
# kodi-gbm (see README → Display ownership). Ctrl-Alt-Fn VT switching
# doesn't work on this console anyway, so the gettys would never be
# reachable from the keyboard — emergency console is AMT SOL on
# ttyS0 instead.
# video=eDP-1:d blanks the internal laptop panel: both boxes are lidless
# HTPCs driving an external display, and Kodi (gbm-direct, single CRTC)
# would otherwise grab the internal panel and nothing would reach the TV.
# Profiles can still append their own args (see mkosi.profiles/).
# No `quiet`: this is a home box, so a verbose boot (kernel + systemd
# messages on the console) is worth more than a clean splash when
# something goes wrong on unfamiliar hardware.
KernelCommandLine=rw console=tty0 console=ttyS0,115200 rd.systemd.gpt_auto=0 systemd.gpt_auto=0 systemd.getty_auto=0 video=eDP-1:d

# Locale + keymap baked in; HTPC has no need to be reconfigurable.
Locale=en_US.UTF-8
Keymap=us
Timezone=America/Chicago

# Don't bake a machine-id — generated on first boot into persist.
# Don't bake a root password — SSH key auth only.
RootPassword=hashed:!locked
Autologin=no

# Hostname is baked into the image, and it's per-box, so it's set per
# profile (mkosi.profiles/<profile>/mkosi.conf): theatre-t480 for the
# t480 profile, bedroom-tv for the zbook profile. This base value is
# only a fallback for a profile-less build (build.sh always passes a
# profile, so it shouldn't normally be hit) — it keeps a stray build
# from booting as a nameless/localhost box.
Hostname=theatre-os

# Name the install-time UKI to match what sysupdate writes for updates,
# so install and update produce the SAME UKI filename in the ESP. Without
# this override, mkosi defaults to `&e-&k` (entry-token + kernel version),
# which leaves an orphan UKI in /efi/EFI/Linux/ that sysupdate's
# InstancesMax retention can't see (mismatching MatchPattern). Pattern
# matches the SplitArtifacts=uki filename and the sysupdate transfer
# file's MatchPattern. Same approach particleos uses (mkosi.conf
# `UnifiedKernelImageFormat=%i_%v_%a`); we drop %a since theatre-os
# only targets x86_64.
UnifiedKernelImageFormat=%i_%v

# Limit the modules (and their firmware deps) bundled into the
# kernel-modules initrd to mkosi-initrd's "default" set — block
# devices, filesystems, etc. needed to mount the rootfs and switch-
# root. Without this, mkosi defaults to including ALL kernel modules
# and ALL of their firmware dependencies, ballooning the UKI to
# >400 MB (mostly redundant Wi-Fi/GPU/sound firmware blobs we don't
# need before switch-root). With our InstancesMax=10 retention, an
# unconstrained UKI would overflow the 2 GB ESP within a few
# updates. Same setting particleos uses.
KernelInitrdModules=default

# `base` already pulls in systemd, systemd-sysvcompat, iproute2,
# iputils, etc. — only list things `base` doesn't drag in.
#
# dosfstools is needed for repart to format the ESP at install-image
# build time AND for fsck on the ESP at runtime.
Packages=
        base
        linux
        linux-firmware
        intel-ucode
        openssh
        sudo
        btrfs-progs
        dosfstools
        less
        vim
        # phase 5: Kodi (gbm renderer) + moonlight-qt (under sway,
        # launched from inside Kodi for game streaming) + polkit
        # (required by the kodi-gbm.service we vendor from the AUR
        # kodi-standalone-service package). The standalone-service
        # package itself isn't in official Arch repos — we ship
        # equivalent units in mkosi.extra/. See README → Kodi &
        # moonlight session.
        kodi
        moonlight-qt
        polkit
        # sway: minimal wayland compositor for moonlight. Originally
        # moonlight ran via Qt EGLFS direct-to-KMS — that worked but
        # added ~one frame (12-17ms) of compositor latency because
        # every video frame goes through Qt's GL composite. Sway hosts
        # moonlight as a wayland client, lets wlroots route VAAPI
        # dmabufs straight to a KMS plane, and exposes per-window
        # allow_tearing + per-output max_render_time tunables — both
        # used in /etc/sway/config. Measured drop: 12-17ms → 2-6ms
        # render-incl-vsync on the same hardware. See README → Kodi &
        # moonlight session.
        sway
        # Hardware video decode for moonlight on the T480's iGPU
        # (Intel Kaby Lake-R UHD 620). Without these moonlight falls
        # back to software FFmpeg decode which can't keep up with
        # 4K60 streams and pegs the CPU. See README → Kodi & moonlight
        # session.
        #
        # intel-media-driver: VAAPI driver for Broadwell+ Intel iGPUs
        #   (the T480's UHD 620 wants this; older `libva-intel-driver`
        #   is for Haswell and below). Listed as an optdep on
        #   moonlight-qt for exactly this reason.
        # vulkan-intel: Vulkan ICD. moonlight's libplacebo renderer
        #   prefers Vulkan; without an ICD it falls back to other
        #   renderers (SDL/EGL). Note: under sway with VAAPI dmabuf
        #   the EGL renderer is what actually gets selected anyway
        #   (see moonlight stats overlay) — but we keep vulkan-intel
        #   so moonlight has the option, and because Mesa pulls it
        #   in as a soft dep regardless.
        intel-media-driver
        vulkan-intel
        # Fonts. The base Arch image ships zero general-purpose fonts;
        # Kodi has its own bundled fonts and doesn't notice, but
        # moonlight-qt's QML UI uses Qt's font system which falls back
        # to whatever fontconfig serves. With nothing installed, every
        # glyph renders as a tofu box. Noto's coverage is broad enough
        # that show titles in any script (CJK, Arabic, etc.) render
        # cleanly — important for a media-room appliance. We skip
        # noto-fonts-extra (variant weights only, +330 MiB) since
        # moonlight's UI never asks for them.
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
        # kodi-send is needed for graceful shutdown — HA's
        # theatre_turn_off automation invokes `kodi-send -a ShutDown`
        # rather than `systemctl poweroff`, because the kodi-gbm
        # service runs in user.slice (PAMName=login) and a direct
        # systemctl invocation would SIGHUP Kodi mid-write rather
        # than letting it flush state. See README → Kodi.
        kodi-eventclients
        # InputStream Adaptive: required by virtually every modern
        # streaming addon (Netflix, YouTube, Plex, Jellyfin, BBC
        # iPlayer, etc.) to play DASH/HLS/SmoothStreaming. Without
        # it most third-party video addons silently fail.
        kodi-addon-inputstream-adaptive
        # Joystick peripheral support: lets a gamepad navigate Kodi
        # itself, and lets controllers pass through cleanly when
        # launching moonlight-qt for game streaming. We use a WeChip
        # G20 air remote (USB HID over 2.4 GHz dongle, kernel-native,
        # no userspace stack needed) as the primary input — no
        # bluetooth stack is installed (see absence of bluez).
        kodi-addon-peripheral-joystick
        # upower: T480 is a laptop, so battery state is meaningful;
        # also lets logind handle lid/power events more cleanly.
        upower
        # udisks2: automount for USB drives plugged into the HTPC
        # (e.g. guest brings holiday photos on a stick).
        udisks2
        # alsa-utils: we deliberately do NOT install pipewire or
        # pulseaudio — this HTPC has exactly one audio client at a
        # time (kodi, or moonlight-qt when streaming games), so
        # there's nothing to mix. Kodi and moonlight-qt both talk
        # ALSA directly, which keeps HDMI bitstream passthrough
        # (Dolby/DTS) clean and removes a daemon-shaped failure
        # mode. alsa-utils gives us aplay/alsamixer for debugging
        # over SSH. The `audio` group is granted to kodi via
        # SupplementaryGroups= in kodi-gbm.service.
        alsa-utils

[Runtime]
# Ephemeral=yes: when running `mkosi vm` (or `boot`/`shell`), operate
# on a temporary reflink snapshot of the .raw rather than the .raw
# itself. Changes made by the VM (machine-id generation, sshd host
# keys, persist mutations, journal entries) are discarded when the
# VM exits.
#
# Without this, every `mkosi vm` invocation contaminates the .raw
# in mkosi.output/ with whatever the qemu boot did. We hit this:
# after a VM test, the .raw uploaded to dufs no longer matched the
# pristine just-built artefact, baking in the dev-box's qemu-side
# machine-id and sshd host keys into the install media. Bad both
# for security (leaked keys) and for reproducibility.
#
# Reflink snapshots are cheap on btrfs (instant, near-zero space),
# so there's no meaningful cost.
Ephemeral=yes
