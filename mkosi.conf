# Top-level mkosi config. Shared base for all subimages.
# Per-subimage overrides live in mkosi.images/<name>/mkosi.conf.

[Distribution]
Distribution=arch

[Output]
ImageId=theatre-os
# The top-level config doesn't itself produce an image — it's just
# shared base config consumed by the subimages in mkosi.images/.
# Without Format=none, mkosi would build a default `disk` image at
# the top level and emit a stray theatre-os_<v>.raw alongside the
# real artefacts.
Format=none
# ImageVersion is read from the executable ./mkosi.version on each build
# and flows into artefact filenames AND /usr/lib/os-release VERSION_ID
# in both the rootfs and the initrd. One source of truth.
# Output / cache / build directories: mkosi auto-detects mkosi.output/,
# mkosi.cache/, mkosi.builddir/ if they exist in the project root.
# Package downloads are cached automatically (in ~/.cache by default,
# or in mkosi.pkgcache/ if the dir exists).

[Content]
# Generic, version-independent kernel cmdline. The version stamp lives
# in the UKI's embedded /usr/lib/os-release; the initrd reads it from
# there to pick @os/<v> / @persist/<v> at mount time.
# console=ttyS0 is for AMT Serial-over-LAN visibility (see README →
# Accounts & remote access).
KernelCommandLine=quiet rw console=tty0 console=ttyS0,115200

# Locale + keymap baked in; HTPC has no need to be reconfigurable.
# Locale + keymap baked in; HTPC has no need to be reconfigurable.
Locale=en_US.UTF-8
Keymap=us
Timezone=America/Chicago

# Don't bake a machine-id — generated on first boot into persist.
# Don't bake a root password — SSH key auth only.
RootPassword=hashed:!locked
Autologin=no

[Validation]
# Single LAN trust boundary; HTTPS + SHA256 covers transport
# corruption. Revisit if updates ever leave the homelab.
SecureBoot=no
