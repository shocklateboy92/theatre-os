# theatre-os mkosi config. Single image build produces:
#
#   theatre-os_<v>.raw          — bootable disk image (`dd` install media)
#   theatre-os_<v>.efi          — UKI matching the rootfs (also consumed
#                                 by sysupdate, dropped into the ESP)
#   theatre-os_<v>.tar          — rootfs tarball (consumed by sysupdate
#                                 on already-installed boxes)
#   theatre-os_<v>.SHA256SUMS   — covers all of the above
#
# Format=disk drives systemd-repart (configs in mkosi.repart/), and
# SplitArtifacts=uki,tar splits the UKI and a tar of the rootfs out
# of the disk build so they can be published independently. See
# README → Build & publish.

[Distribution]
Distribution=arch

[Output]
ImageId=theatre-os
Format=disk
SplitArtifacts=uki,tar
# Tar is uncompressed: gigabit LAN, wire time is seconds. Transport
# compression can be added at the HTTP layer later without touching
# this repo. See README → Build & publish.
CompressOutput=no
# ImageVersion is read from the executable ./mkosi.version on each build
# and flows into artefact filenames AND /usr/lib/os-release VERSION_ID
# in both the rootfs and the initrd. One source of truth.
# Output / cache / build directories: mkosi auto-detects mkosi.output/,
# mkosi.cache/, mkosi.builddir/ if they exist in the project root.
# Package downloads are cached automatically (in ~/.cache by default,
# or in mkosi.pkgcache/ if the dir exists).

[Validation]
# Single LAN trust boundary; HTTPS + SHA256 covers transport
# corruption. Revisit if updates ever leave the homelab.
SecureBoot=no
# SHA256SUMS covering all artefacts. See README → Architecture →
# Distribution: HTTPS + SHA256 is our integrity story; no GPG signing.
Checksum=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
# Use our custom initrd subimage (mkosi.images/initrd/) instead of
# the auto-built default. We need .mount units inside the initrd to
# mount @os/<v> at /sysroot, and mkosi's auto-built initrd doesn't
# inherit our mkosi.extra/ — only a sibling subimage with
# `Include=mkosi-initrd` can carry our overlay.
Initrds=%O/initrd
Dependencies=initrd

# Generic, version-independent kernel cmdline. The version stamp lives
# in the UKI's embedded /usr/lib/os-release; the initrd reads it from
# there to pick @os/<v> / @persist/<v> at mount time.
# console=ttyS0 is for AMT Serial-over-LAN visibility (see README →
# Accounts & remote access).
#
# rd.systemd.gpt_auto=0 + systemd.gpt_auto=0 disable systemd-gpt-
# auto-generator. Without this, when there's no `root=` on the
# cmdline AND we boot via systemd-boot (which sets the EFI
# LoaderDevicePartUUID variable), the generator engages root
# auto-discovery, registers a fsck dependency on /dev/gpt-auto-root,
# fails to find a discoverable root partition (our data partition
# is GPT type "Linux generic data", not SD_GPT_ROOT), and the leaked
# fsck dependency hangs initrd-root-fs.target forever — even though
# our own sysroot.mount overrides the generated one. There is no
# per-unit "I've got this" mechanism upstream (see systemd#35628).
#
# Verified no functional loss: of the partition types gpt-auto
# handles (root, /home, /srv, /var, /var/tmp, swap, ESP, XBOOTLDR),
# only ESP matches anything we have. We don't auto-mount the ESP at
# /efi because nothing on the running system needs it there —
# sysupdate locates the ESP itself via PathRelativeTo=esp (see
# sysupdate.d(5)), and bootctl works against it directly.
KernelCommandLine=quiet rw console=tty0 console=ttyS0,115200 rd.systemd.gpt_auto=0 systemd.gpt_auto=0

# Locale + keymap baked in; HTPC has no need to be reconfigurable.
Locale=en_US.UTF-8
Keymap=us
Timezone=America/Chicago

# Don't bake a machine-id — generated on first boot into persist.
# Don't bake a root password — SSH key auth only.
RootPassword=hashed:!locked
Autologin=no

# Phase 2: minimum to boot to a shell + accept SSH + own a btrfs
# data partition with the @os/<v> + @persist/<v> layout. Mount logic
# (phase 3) and Kodi (phase 5) come later.
#
# `base` already pulls in systemd, systemd-sysvcompat, iproute2,
# iputils, etc. — only list things `base` doesn't drag in.
#
# dosfstools is needed for repart to format the ESP at install-image
# build time AND for fsck on the ESP at runtime.
Packages=
        base
        linux
        linux-firmware
        intel-ucode
        openssh
        sudo
        btrfs-progs
        dosfstools
        less
        vim
