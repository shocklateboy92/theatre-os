# theatre-os: ALSA default-PCM routing.
#
# Routes the ALSA "default" PCM to the HDMI/AVR sink via dmix.
# Two requirements drive the design:
#
# 1. Multiple concurrent streams on the same device. Kodi opens
#    "default" for both main playback AND nav-sound effects, and
#    they have to coexist. ALSA's "type hw" PCM is exclusive
#    single-stream, so a second open returns EBUSY and nav sounds
#    stay silent. dmix mixes streams in software before handing
#    them to the underlying hw device.
#
# 2. Lossless bitstream passthrough must NOT go through dmix.
#    Dolby TrueHD / DTS-HD MA bitstreams aren't PCM and dmix would
#    corrupt them. The README's audio philosophy (Kodi & moonlight
#    session → Audio) requires this to keep working. Kodi addresses
#    its passthrough output via an explicit device path
#    (audiooutput.passthroughdevice = ALSA:hdmi:CARD=PCH,DEV=0 in
#    guisettings.xml), which bypasses our "default" definition
#    entirely and goes straight to the hw device. Verified working:
#    DD passthrough still lights up the AVR's DD indicator with
#    this config in place.
#
# Name-based card identifier (CARD=PCH) not numeric index. Card
# indices are NOT stable on this hardware: plugging in a USB audio
# device (e.g. the dock's Hybrid USB-C audio) shifts every index,
# and the resulting hw:1,3 reference no longer points at the HDMI
# sink. Name-based lookup uses the kernel's persistent card name
# (set from snd-hda-intel's id= or the codec name) and is stable
# across boots and dock changes.
#
# Trade-off: snd_func_card_inum (the libasound function that
# resolves CARD=PCH → card number) needs read access to the
# controlC* control device for that card. logind grants this via
# ACL only to processes in the active seat session. In practice
# this is fine — Kodi (kodi-gbm.service) and moonlight
# (theatre-os-moonlight.service) both use PAMName=login and run in
# real seat sessions, so they get the ACL. Debugging from a
# non-seat shell (`sudo -u kodi aplay …`) won't work; use a
# `machinectl shell --uid=kodi` or run from kodi's actual session
# instead.
#
# Format pinned to 48k / S16_LE / stereo: matches Wolf's Opus
# output (the moonlight server's audio format) and Kodi's UI
# sound assets. Anything wanting more — multichannel PCM, higher
# sample rates, bitstream — must address the hw device directly,
# which Kodi already does for passthrough as noted above.
#
# Discovered/validated by experiment 2026-05-13. See also the
# SDL_AUDIO_DRIVER=alsa env var on theatre-os-moonlight.service,
# which prevents moonlight from heap-corrupting on PipeWire probe
# failure (PipeWire is intentionally absent from this image).

pcm.!default {
  type plug
  slave.pcm "dmixer"
}

pcm.dmixer {
  type dmix
  ipc_key 1024
  slave {
    pcm "hw:CARD=PCH,DEV=3"
    rate 48000
    format S16_LE
    channels 2
    period_time 0
    period_size 1024
    buffer_size 4096
  }
}

ctl.!default {
  type hw
  card PCH
}
