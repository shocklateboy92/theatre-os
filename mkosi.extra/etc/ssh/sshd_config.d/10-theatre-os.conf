# theatre-os: root SSH is the ONLY admin path; key auth only.
# See README → Accounts & remote access.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Host keys live under /var/lib/ssh/ instead of the default
# /etc/ssh/ — /var is already bind-mounted from @persist/<v>, so keys
# survive across OS rollbacks/updates without needing to bind-mount
# /etc/ssh (which would also hide this very config file).
# sshd-keygen.service writes the actual key material on first boot
# (see sshdgenkeys.service.d/10-theatre-os-persist.conf).
HostKey /var/lib/ssh/ssh_host_ed25519_key
HostKey /var/lib/ssh/ssh_host_rsa_key
