# theatre-os: runtime systemd-repart config to grow the data
# partition on first boot to fill the target disk.
#
# This file is shipped INTO the rootfs (under /usr/lib/repart.d/) so
# systemd-repart.service finds it on every boot — it's gated by a
# ConditionDirectoryNotEmpty on the repart.d dirs, which would
# otherwise no-op-skip with no configs present.
#
# Distinct from the BUILD-time configs in mkosi.repart/ (which
# create the partition + subvolumes + initial CopyFiles) — at
# runtime we only want to grow, never recreate. So this config
# matches existing partitions only (Type + Label) and has no
# Subvolumes=, MakeDirectories=, or CopyFiles= directives.
#
# Once the partition fills the disk on first boot, repart re-runs
# on subsequent boots are no-ops (nothing left to grow). Cheap.
#
# See README → Initial install / disk provisioning → First-boot grow.

[Partition]
Type=linux-generic
Label=theatre-os-data
# Pinned PARTUUID — must match the build-time config in
# mkosi.repart/10-data.conf. repart matches existing partitions
# by Type+Label (and UUID if set), so listing it here keeps the runtime
# grow operation idempotent and prevents repart from ever trying to
# create a SECOND data partition with a different auto-generated UUID.
UUID=78332b2c-d061-488f-8f21-41f3fa97226a
# Grow to fill the disk. SizeMaxBytes is unset (= unbounded) so
# repart expands to use all available space.
SizeMinBytes=8G
GrowFileSystem=yes
