# SHIELD Remote (and other HID remotes) report KEY_POWER, which the kernel
# tags as a `power-switch` input device. logind's default
# HandlePowerKey=poweroff turns "wake from suspend" into "immediate shutdown"
# — pressing the remote's power button to wake the box powers it off instead.
#
# Kodi handles its own shutdown/suspend via UI and JSON-RPC, so logind has
# no reason to act on power key events. See legacy-zbook-libreelec.md for
# the original diagnosis.

[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
