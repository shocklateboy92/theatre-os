# Override Arch's sshdgenkeys.service to write keys under
# /var/lib/ssh/ instead of /etc/ssh/ (which is on the RO @os/<v>
# subvolume). Matches the HostKey= paths configured in
# /etc/ssh/sshd_config.d/10-theatreos.conf.
#
# The upstream unit hardcodes `ssh-keygen -A` which uses the
# compiled-in /etc/ssh/ path with no override flag, so we replace
# ExecStart entirely (the empty ExecStart= line clears the
# inherited value).

[Unit]
# Reverse the path checks: skip if the new-location keys already
# exist. Resetting with empty value first.
ConditionPathExists=
ConditionPathExists=|!/var/lib/ssh/ssh_host_ed25519_key
ConditionPathExists=|!/var/lib/ssh/ssh_host_rsa_key
After=var.mount
Requires=var.mount

[Service]
ExecStart=
ExecStart=/usr/bin/ssh-keygen -q -t ed25519 -f /var/lib/ssh/ssh_host_ed25519_key -N ""
ExecStart=/usr/bin/ssh-keygen -q -t rsa -b 4096 -f /var/lib/ssh/ssh_host_rsa_key -N ""
