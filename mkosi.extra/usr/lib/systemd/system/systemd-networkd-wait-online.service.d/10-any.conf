# theatre-os: don't block boot on every NIC.
#
# Default systemd-networkd-wait-online waits for *all* managed
# interfaces to be configured AND at least one to be online. On the
# T480, the dock's USB-C ethernet (enp60s0u1u3) is managed by the
# en* match in 20-wired.network but usually has no cable plugged in,
# so wait-online times out after ~2 minutes before graphical.target
# (and Kodi) can proceed.
#
# --any flips the semantics: return as soon as ANY one managed
# interface is online. Whichever NIC has a cable wins; the other is
# allowed to stay down.
#
# We can't just disable wait-online: kodi-gbm.service is ordered
# After=network-online.target because Jellyfin for Kodi's startup
# sync fails silently if Kodi launches before the network is up, and
# the addon doesn't recover without a manual Kodi restart. So we keep
# the gate, we just stop it from being pessimistic.
#
# Trade-off: if both NICs are plugged in at boot and the dock comes
# up a few ms before the primary, network-online.target fires with
# only the dock online. Fine here — both NICs are on the same LAN
# with the same gateway, so any route reaches Jellyfin, and kernel
# route metrics sort it out once the primary appears. Would matter
# only if the two NICs were on different networks.

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
