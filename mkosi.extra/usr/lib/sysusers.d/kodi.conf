# theatre-os: kodi user.
#
# Vendored from the AUR package `kodi-standalone-service` (graysky2),
# but with overrides for our setup:
#   - Pinned UID 420 for stability across rebuilds (upstream lets
#     sysusers auto-allocate from the system range, which has
#     bitten people when the picked UID drifts and persist files
#     end up owned by the wrong number).
#   - Home directory is /home/kodi, not /var/lib/kodi. /home/kodi
#     is bind-mounted from @persist/<v>/home/kodi at boot (see
#     mkosi.images/initrd/.../sysroot-home-kodi.mount), so kodi's
#     userdata (.kodi/, .config/moonlight, library, watch state)
#     persists across reboots and rolls back atomically with the
#     OS via the per-version persist forking.
#   - Shell stays nologin (no SSH, no interactive login —
#     administrative access is via root over SSH only, per
#     README → Accounts & remote access).
#
# The supplementary groups (audio, video, optical, video_dma) are
# defined here only to ensure they exist; actual membership is
# granted to specific services via SupplementaryGroups= in the
# service units (so e.g. an unrelated kodi process running outside
# kodi-gbm.service doesn't get GPU access).
#
# `network` and `input` are added to the user's primary group
# memberships in upstream's kodi.target (we don't ship that target
# — see kodi-gbm.service for why). We grant them via
# SupplementaryGroups= in kodi-gbm.service instead.

# Type Name ID GECOS                Home directory Shell
u     kodi 420 "Kodi (theatre-os)"  /home/kodi     /usr/sbin/nologin

g audio     -
g optical   -
g video     -
g video_dma -
