# theatre-os: ensure kodi's home directory is correctly owned at every
# boot.
#
# /home/kodi is bind-mounted from @persist/<v>/home/kodi (see
# mkosi.images/initrd/.../sysroot-home-kodi.mount). The directory is
# created at install time inside @persist via repart's MakeDirectories=
# (see mkosi.repart.in/10-data.conf.in), but with no ownership
# guarantees beyond root:root. tmpfiles fixes that on every boot —
# idempotent, cheap, robust against ownership drift.
#
# The `d` directive creates the directory if it doesn't exist, and
# always sets the listed mode/owner/group on every run.
#
# Mode 0755 (not 0750) is intentional: we want HA's deploy.sh to be
# able to push Kodi addons via SSH, which lands as root and writes
# under /home/kodi/.kodi/. World-readable means root can traverse
# without needing to be in the kodi group.

# Type Path       Mode User Group Age Argument
d      /home/kodi 0755 kodi kodi  -   -
