# Custom initrd subimage. Inherits the entire upstream mkosi-initrd
# config (kernel modules, base packages, MakeInitrd=yes, etc.) and
# overlays our custom .mount units on top via mkosi.extra/.
#
# Why a separate subimage at all? mkosi's auto-built default initrd
# does NOT inherit the top-level mkosi.extra/ — it's an internal
# sub-build with its own narrow scope. The supported way to add
# files to the initrd is to define a sibling subimage that
# Include='s mkosi-initrd and adds its own mkosi.extra/.
#
# The top-level mkosi.conf wires this subimage's output into the
# main image via Initrds=%O/initrd/initrd.

[Config]
Include=mkosi-initrd

[Output]
Format=cpio
Output=initrd
