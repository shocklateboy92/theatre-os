# Custom initrd subimage. Inherits the entire upstream mkosi-initrd
# config (kernel modules, base packages, MakeInitrd=yes, etc.) and
# overlays our custom .mount units on top via mkosi.extra/.
#
# Why a separate subimage at all? mkosi's auto-built default initrd
# does NOT inherit the top-level mkosi.extra/ — it's an internal
# sub-build with its own narrow scope. The supported way to add
# files to the initrd is to define a sibling subimage that
# Include='s mkosi-initrd and adds its own mkosi.extra/.
#
# The top-level mkosi.conf wires this subimage's output into the
# main image via Initrds=%O/initrd/initrd.

[Config]
Include=mkosi-initrd

[Output]
Format=cpio
Output=initrd

[Content]
# Strip the network + system-bus stack out of the initrd.
#
# mkosi-initrd is minimal, but Arch's `systemd` package is monolithic:
# systemd-networkd/systemd-resolved ship inside it (not separate
# packages, so RemovePackages= can't touch them), and systemd's stock
# 90-systemd.preset enables them. Our initrd boots from a LOCAL NVMe
# btrfs (mount @os/@persist, gen machine-id, snapshot persist,
# switch-root) — it needs none of it.
#
# Left running, it breaks boot: systemd-resolved comes up and touches
# the system bus, which socket-activates dbus-broker at the very TAIL of
# the initrd (as basic.target is reached), right as switch-root teardown
# begins. dbus-broker-launch catches SIGTERM mid-startup, misses it, and
# then sits until its 90s TimeoutStopSec fires -> SIGKILL — the ~90s
# silent stall (kernel-log gap 2.6s -> 94.5s, "initrd 1min33s").
#
# A preset can't undo this: the enablement symlinks under
# /etc/systemd/system/*.wants aren't governed by our preset in this
# subimage (verified — a `disable` preset in mkosi.extra/, even on a
# clean build, leaves them in place). RemoveFiles= runs AFTER
# `systemctl preset-all` (see mkosi(1) build order), so it deletes the
# symlinks outright. We drop both the network stack and dbus's socket
# activation, so dbus-broker is never started and there's nothing to
# hang. The real rootfs enables all of these normally; this only strips
# the initrd cpio.
RemoveFiles=
        /etc/systemd/system/*/systemd-networkd*
        /etc/systemd/system/*/systemd-resolved*
        /etc/systemd/system/*/systemd-network-generator.service
        /usr/lib/systemd/system/sockets.target.wants/dbus.socket
        /usr/lib/systemd/system/multi-user.target.wants/dbus.service
