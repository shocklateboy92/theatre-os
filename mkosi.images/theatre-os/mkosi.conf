# theatre-os subimage: produces the rootfs tar + matching UKI that
# sysupdate consumes. See README → Build & publish.
#
# Subimage is named `theatre-os` (matching ImageId) so that mkosi's
# default output naming yields theatre-os_<v>.<ext>. (mkosi prefers
# the subimage name over ImageId for output stems when an explicit
# Output= isn't set.)

[Output]
Format=tar
SplitArtifacts=uki
# Tar is uncompressed: gigabit LAN, wire time is seconds. Transport
# compression can be added at the HTTP layer later without touching
# this repo. See README → Build & publish.
CompressOutput=no

[Validation]
# SHA256SUMS covering all artefacts of this image. See README →
# Architecture → Distribution: HTTPS + SHA256 is our integrity
# story; no GPG signing.
Checksum=yes

[Content]
Bootable=yes
Bootloader=systemd-boot

# Phase 1: minimum to boot to a shell and accept SSH. No Kodi yet.
# `base` already pulls in systemd, systemd-sysvcompat, iproute2,
# iputils, etc. — only list things `base` doesn't drag in.
Packages=
        base
        linux
        linux-firmware
        intel-ucode
        openssh
        sudo
        btrfs-progs
        less
        vim
