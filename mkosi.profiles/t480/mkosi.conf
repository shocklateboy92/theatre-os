# Profile: t480 — the theatre HTPC (Lenovo ThinkPad T480).
#
# This is the default profile (build.sh selects it when --profile= is
# omitted), so plain `./build.sh` still produces the T480 image exactly
# as before profiles existed. See t480-hardware-quirks.md.
#
# Everything specific to THIS box lives under this profile — either here
# (config) or in mkosi.profiles/t480/mkosi.extra/ (rootfs overlay):
#
#   - Hostname + the sysupdate source path baked into the image
#     (mkosi.profiles/t480/mkosi.extra/usr/lib/sysupdate.d/*.transfer
#     point at .../sysupdate/theatre-t480/).
#   - The AVR volume Kodi addon + keymap and the AVR event logger
#     (HA -> Denon AVR-S970H). The bedroom box drives volume over
#     HDMI-CEC instead, so these are t480-only.
#   - The 40-60% battery charge-threshold udev rule (ThinkPad EC sysfs).
#   - video=eDP-1:d to blank the internal panel (T480 HDMI 1.4 cap
#     forces USB-C DP-alt for 4K60 — see t480-hardware-quirks.md).

[Content]
Hostname=theatre-t480

# Appended to the base KernelCommandLine in mkosi.conf. T480-only: the
# internal eDP panel is disabled because the display chain runs over
# USB-C DP-alt (t480-hardware-quirks.md).
KernelCommandLine=video=eDP-1:d
