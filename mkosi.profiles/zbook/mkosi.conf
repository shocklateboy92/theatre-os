# Profile: zbook — the bedroom-TV HTPC (HP ZBook).
#
# Selected with `./build.sh --profile=zbook ...`. Same OS as the t480
# (shared mkosi.conf + mkosi.extra/), deliberately leaner:
#
#   - Volume runs over HDMI-CEC via a Pulse-Eight USB-CEC adapter. kodi
#     already depends on libcec and drives the adapter as a built-in
#     peripheral, so this image ships NONE of the AVR volume addon /
#     keymap / event logger that the t480 profile carries. No extra
#     package or config is needed for CEC volume — just the adapter.
#
# Hardware quirks confirmed on the real machine (2026-07-02) — see
# zbook-hardware-quirks.md:
#
#   - Display: the TV lands on DP-3; eDP-1 is the internal panel. We
#     blank it (see KernelCommandLine below), and Kodi drives DP-3.
#   - Audio: Comet Lake defaults to the SOF DSP driver, whose firmware
#     we don't ship, so ZERO sound cards register. We force the legacy
#     snd-hda-intel driver (see KernelCommandLine) — that gives a
#     "PCH" card matching the shared /etc/asound.conf (hw:CARD=PCH,DEV=3).
#   - Battery: the HP EC does NOT expose charge_control_*_threshold, so
#     the ThinkPad 40-60% rule can't apply here (correctly t480-only).
#     Left alone for now (always-plugged-in box).

[Content]
Hostname=bedroom-tv

# Two appended kernel args, both ZBook-specific:
#
# video=eDP-1:d — blank the internal laptop panel so Kodi (gbm-direct,
#   single CRTC) outputs to the external TV (on DP-3) instead of the
#   built-in screen. Confirmed eDP-1 = the internal panel on hardware.
#
# snd_intel_dspcfg.dsp_driver=1 — force the legacy snd-hda-intel driver
#   instead of SOF. The ZBook's Comet Lake HD-Audio otherwise binds the
#   sof-audio-pci-intel-cnl DSP driver, which needs firmware we don't
#   ship (intel/sof/sof-cml.ri) → probe fails → no sound cards at all,
#   including the iGPU's DP/HDMI audio. dsp_driver=1 gives the classic
#   "PCH" HDA card the T480 uses, so the shared /etc/asound.conf
#   (hw:CARD=PCH,DEV=3) and Kodi's passthrough config work unchanged.
KernelCommandLine=video=eDP-1:d snd_intel_dspcfg.dsp_driver=1
