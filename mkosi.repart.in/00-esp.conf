# ESP partition. Holds systemd-boot + UKIs.
#
# 2 GiB is oversized intentionally — see README → Partition layout.
# The headroom exists so we can experiment with alternate boot
# artefacts (recovery UKIs, debug variants) without re-partitioning.
#
# Static config (no version templating needed); copied verbatim by
# scripts/build.sh.

[Partition]
Type=esp
Format=vfat
# Two CopyFiles= directives — both needed:
#   /efi/  → systemd-boot binary, /loader/loader.conf, fallback
#            BOOTX64.EFI. mkosi's install_systemd_boot writes here.
#   /boot/ → UKIs in EFI/Linux/<token>-<kver>.efi. mkosi's
#            install_uki writes here. Without this, systemd-boot
#            enumerates an empty menu and the firmware drops to its
#            own boot manager.
# repart paths are relative to the rootfs (mkosi sets --root= for
# repart). See repart.d(5) → CopyFiles=.
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=2G
SizeMaxBytes=2G
